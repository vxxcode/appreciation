<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💕</title>
<style>
  :root {
    --pink: #ff6fa5;
    --pink-dark: #e0507f;
    --pink-light: #ffd6e8;
    --pink-pale: #fff0f6;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fff0f6 0%, #ffe0ed 40%, #ffd1e3 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    padding: clamp(16px, 5vw, 24px);
  }

  /* ---------- FLOATING HEARTS BACKGROUND ---------- */
  .hearts-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-heart {
    position: absolute;
    bottom: -60px;
    color: var(--pink-light);
    opacity: 0.55;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-115vh) translateX(20px) rotate(25deg); opacity: 0; }
  }

  /* ---------- LETTER ---------- */
  .letter {
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 28px 28px 28px 6px;
    padding: clamp(32px, 6vw, 56px) clamp(20px, 5vw, 44px);
    text-align: center;
    width: 100%;
    max-width: 620px;
    box-shadow: 0 18px 50px rgba(224, 80, 127, 0.22);
    border: 1px solid var(--pink-light);
  }

  .letter::before {
    content: "💌";
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(1.7rem, 4vw, 2.2rem);
    background: var(--pink-pale);
    border-radius: 50%;
    width: clamp(44px, 8vw, 54px);
    height: clamp(44px, 8vw, 54px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(224, 80, 127, 0.28);
  }

  .letter p {
    color: #8a4767;
    line-height: 1.9;
    font-size: clamp(0.95rem, 2.6vw, 1.12rem);
  }

  .letter .signoff {
    margin-top: 26px;
    font-family: 'Brush Script MT', cursive;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    color: var(--pink-dark);
  }

  /* ---------- PHOTO ---------- */
  .photo-wrap {
    margin: 0 auto 28px;
    width: clamp(130px, 32vw, 200px);
    height: clamp(130px, 32vw, 200px);
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #fff;
    box-shadow: 0 10px 28px rgba(224, 80, 127, 0.3);
    position: relative;
    background: var(--pink-pale);
  }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-wrap .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    color: var(--pink);
  }

  .photo-upload-btn {
    display: inline-block;
    margin-top: -6px;
    margin-bottom: 22px;
    font-size: 0.85rem;
    color: var(--pink-dark);
    background: var(--pink-pale);
    border: 1px solid var(--pink-light);
    border-radius: 20px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .photo-upload-btn:hover {
    background: var(--pink-light);
  }

  #photoInput {
    display: none;
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="letter">
  <!--
    Set your picture here — paste an image URL into src=""
    e.g. <img id="photoImg" src="https://example.com/your-photo.jpg" alt="Us">
  -->
  <div class="photo-wrap" id="photoWrap">
    <img id="photoImg" src="sabina.jpg" alt="Our photo" style="display:none;">
    <div class="placeholder" id="photoPlaceholder">🤍</div>
  </div>

  <p>
    Hey baby, I just want to express how much I appreciate you. 
    You are my everything, my love, and my best friend. 
    Every day with you is a blessing, and I am always so grateful for your love and support. 
    Thank you for being the amazing person that you are.
  </p>
  <p class="signoff">— Your husband, sei</p>
</div>

<script>
  const heartsBg = document.getElementById('heartsBg');
  const heartEmojis = ['💗', '💕', '💓', '❤', '💞'];

  function spawnBgHeart() {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (1 + Math.random() * 1.6) + 'rem';
    const duration = 9 + Math.random() * 8;
    h.style.animationDuration = duration + 's';
    heartsBg.appendChild(h);
    setTimeout(() => h.remove(), duration * 1000);
  }

  for (let i = 0; i < 12; i++) {
    setTimeout(spawnBgHeart, i * 700);
  }
  setInterval(spawnBgHeart, 1400);

  /* Photo display */
  const photoImg = document.getElementById('photoImg');
  const photoPlaceholder = document.getElementById('photoPlaceholder');

  if (photoImg.getAttribute('src')) {
    photoImg.style.display = 'block';
    photoPlaceholder.style.display = 'none';
  }
</script>

</body>
</html>
